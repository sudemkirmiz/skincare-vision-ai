[project]
name = "skincare-vision-ai"
version = "2.0.0"
description = "Care-oriented facial skin appearance analysis with YOLO + VLM (non-medical)."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sudem Kırmız" }]

[project.urls]
Repository = "https://github.com/sudemkirmiz/skincare-vision-ai"
Issues = "https://github.com/sudemkirmiz/skincare-vision-ai/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [".venv", "docs", "outputs", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long Turkish UI strings and prompts are kept on one line on purpose.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "config", "health", "history", "report", "api", "users", "recommendation", "vlm_quality", "vlm_router", "detection", "imaging", "main", "output", "preprocessing", "safety", "vlm_engine"]
