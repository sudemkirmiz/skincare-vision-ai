name: skincare-vision-ai

services:
  app:
    image: ${SKINCARE_IMAGE:-skincare-vision-ai:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      HISTORY_DB_PATH: /app/state/history.db
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - skincare_state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  skincare_state:
    name: skincare-vision-ai-state
